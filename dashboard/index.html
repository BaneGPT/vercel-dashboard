          </a>
          <a href="#" class="sidebar-link" data-view="analytics" onclick="showView('analytics'); return false;">
            <svg class="w-4.5 h-4.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
            <span>Analytics</span>
          </a>
          <a href="#" class="sidebar-link" data-view="geo" onclick="showView('geo'); return false;">
            <svg class="w-4.5 h-4.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><circle cx="12" cy="10" r="3"/><path d="M12 21.7a10 10 0 1 0 0-20 10 10 0 0 0 0 20z"/></svg>
            <span>Geographic</span>
          </a>
          <a href="#" class="sidebar-link" data-view="timeline" onclick="showView('timeline'); return false;">
            <svg class="w-4.5 h-4.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span>Timeline</span>
          </a>
          <a href="#" class="sidebar-link" data-view="files" onclick="showView('files'); return false;">
            <svg class="w-4.5 h-4.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            <span>Files</span>
          </a>
        </nav>

        <!-- Connection Status -->
        <div class="p-3 border-t border-gray-800/50">
          <div class="flex items-center gap-3">
            <div id="connIndicator" class="w-2 h-2 rounded-full bg-gray-600 transition-colors"></div>
            <div class="flex-1 min-w-0">
              <p class="text-[0.625rem] font-medium text-gray-300 truncate">Connection</p>
              <p id="connStatus" class="text-[0.625rem] text-gray-500 truncate">Disconnected</p>
            </div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Sidebar Overlay (Mobile) -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-black/60 z-30 hidden lg:hidden" onclick="toggleSidebar()" aria-hidden="true"></div>

    <!-- Main Content -->
    <main class="flex-1 lg:ml-64 min-h-screen flex flex-col" id="mainContent">
      <!-- Top Bar -->
      <header class="bg-surface-900/80 backdrop-blur-xl border-b border-gray-800/50 sticky top-0 z-20">
        <div class="flex items-center justify-between h-14 px-4 sm:px-5">
          <div class="flex items-center gap-3">
            <button class="lg:hidden btn-icon" onclick="toggleSidebar()" aria-label="Toggle navigation">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <h2 id="viewTitle" class="font-display font-semibold text-white text-lg hidden sm:block">Overview</h2>
          </div>

          <div class="flex items-center gap-2.5">
            <!-- Theme Selector -->
            <div class="relative hidden sm:block">
              <select id="themeSelect" class="input-base appearance-none pr-8 w-auto py-1.5 text-sm" onchange="EnhancedUI.themes.applyTheme(this.value)">
                <option value="chaos">Chaos</option>
                <option value="matrix">Matrix</option>
                <option value="midnight">Midnight</option>
                <option value="blood">Blood</option>
                <option value="mono">Mono</option>
              </select>
              <div class="absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none text-gray-500">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
              </div>
            </div>

            <!-- Time Range -->
            <select id="timeRange" class="input-base w-auto py-1.5 text-sm hidden md:block" onchange="refreshView()">
              <option value="1h">1h</option>
              <option value="6h">6h</option>
              <option value="24h" selected>24h</option>
              <option value="7d">7d</option>
              <option value="30d">30d</option>
            </select>

            <!-- Refresh Button -->
            <button id="refreshBtn" class="btn-secondary hidden sm:flex" onclick="refreshView()" aria-label="Refresh data">
              <svg class="w-4 h-4" id="refreshIcon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
              <span class="hidden sm:inline">Refresh</span>
            </button>

            <!-- Auth/User -->
            <div class="flex items-center gap-2">
              <button id="authBtn" class="btn-ghost text-xs hidden sm:flex" onclick="openAuthModal()">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
                <span id="authStatus">Sign In</span>
              </button>
              
              <!-- User Menu (when logged in) -->
              <div id="userMenu" class="hidden relative">
                <button class="btn-icon relative" onclick="toggleUserMenu()" aria-label="User menu" aria-expanded="false">
                  <div id="userAvatar" class="avatar bg-gradient-to-br from-chaos-500 to-chaos-600 text-surface-950">U</div>
                </button>
                <div id="userDropdown" class="dropdown-menu hidden">
                  <div class="px-3 py-2 border-b border-gray-800">
                    <p class="text-xs font-medium text-white" id="userName">User</p>
                    <p class="text-[0.5625rem] text-gray-500 font-mono" id="userRole">Role</p>
                  </div>
                  <button class="dropdown-item" onclick="openCampaignModal()">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.5v15m7.5-7.5h-15"/></svg>
                    New Campaign
                  </button>
                  <button class="dropdown-item" onclick="showView('campaigns')">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                    Campaigns
                  </button>
                  <button class="dropdown-item" onclick="showView('systems')">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c-.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    Systems
                  </button>
                  <div class="dropdown-divider"></div>
                  <button class="dropdown-item danger" onclick="signOut()">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                    Sign Out
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </header>

      <!-- View Tabs (Mobile) -->
      <div class="lg:hidden overflow-x-auto px-3 py-2 border-b border-gray-800/50 scrollbar-thin" id="mobileTabs" role="tablist">
        <button class="tab-btn tab-btn-active whitespace-nowrap" data-view="overview" onclick="showView('overview')" role="tab" aria-selected="true">Overview</button>
        <button class="tab-btn whitespace-nowrap" data-view="systems" onclick="showView('systems')" role="tab" aria-selected="false">Systems</button>
        <button class="tab-btn whitespace-nowrap" data-view="campaigns" onclick="showView('campaigns')" role="tab" aria-selected="false">Campaigns</button>
        <button class="tab-btn whitespace-nowrap" data-view="analytics" onclick="showView('analytics')" role="tab" aria-selected="false">Analytics</button>
        <button class="tab-btn whitespace-nowrap" data-view="geo" onclick="showView('geo')" role="tab" aria-selected="false">Geo</button>
        <button class="tab-btn whitespace-nowrap" data-view="timeline" onclick="showView('timeline')" role="tab" aria-selected="false">Timeline</button>
        <button class="tab-btn whitespace-nowrap" data-view="files" onclick="showView('files')" role="tab" aria-selected="false">Files</button>
      </div>

      <!-- View Content -->
      <div class="flex-1 overflow-auto p-4 sm:p-5" id="viewContent">
        <!-- Views rendered dynamically -->
      </div>
    </main>
  </div>

  <!-- Modals -->
  <div id="modalRoot"></div>

  <!-- Toast Container -->
  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Chart.js Default Config -->
  <script>
    Chart.defaults.color = '#71717a';
    Chart.defaults.font.family = 'Inter';
    Chart.defaults.borderColor = '#262626';
    Chart.defaults.plugins.legend.labels.usePointStyle = true;
    Chart.defaults.plugins.legend.labels.padding = 16;
    Chart.defaults.plugins.legend.labels.font.size = 11;
    Chart.defaults.plugins.tooltip.backgroundColor = '#111';
    Chart.defaults.plugins.tooltip.borderColor = '#2a2a2a';
    Chart.defaults.plugins.tooltip.borderWidth = 1;
    Chart.defaults.plugins.tooltip.padding = 10;
    Chart.defaults.plugins.tooltip.titleFont.size = 12;
    Chart.defaults.plugins.tooltip.bodyFont.size = 11;
    Chart.defaults.plugins.tooltip.bodyFont.family = 'JetBrains Mono';
    Chart.defaults.plugins.tooltip.cornerRadius = 8;
    Chart.defaults.scales.x.grid.color = '#222';
    Chart.defaults.scales.y.grid.color = '#222';
    Chart.defaults.interaction.mode = 'index';
    Chart.defaults.interaction.intersect = false;
  </script>

  <!-- Main App Script -->
  <script src="/app.js"></script>
</body>
</html>
