<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chaos C2 — Command & Control</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/design-system.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-treemap@3.0.0/dist/chartjs-chart-treemap.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-funnel@3.0.0/dist/chartjs-chart-funnel.umd.min.js"></script>
  <script src="/enhanced-ui.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            chaos: {
              50: '#fef7f0', 100: '#fdedeb', 200: '#fad9c9', 300: '#f5bb8a',
              400: '#ee954d', 500: '#e6731d', 600: '#d45d14', 700: '#b04711',
              800: '#8d3911', 900: '#713010', 950: '#3d1807'
            },
            surface: {
              950: '#030303', 900: '#0a0a0a', 850: '#111111',
              800: '#181818', 750: '#1f1f1f', 700: '#262626'
            }
          },
          fontFamily: {
            mono: ['JetBrains Mono', 'Fira Code', 'Consolas', 'monospace'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Space Grotesk', 'Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    * { font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .font-display { font-family: 'Space Grotesk', sans-serif; }
    .bg-grid { background-image: linear-gradient(rgba(214,120,30,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(214,120,30,0.025) 1px, transparent 1px); background-size: 48px 48px; }
    .bg-mesh { background-image: radial-gradient(ellipse at 20% 20%, rgba(214,120,30,0.08) 0%, transparent 50%), radial-gradient(ellipse at 80% 80%, rgba(14,199,125,0.05) 0%, transparent 50%); }
    .bg-radial { background: radial-gradient(ellipse at 50% 0%, rgba(214,120,30,0.06) 0%, transparent 60%), #030303; }
    
    .scrollbar-thin::-webkit-scrollbar { width: 5px; height: 5px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; border: 2px solid #0a0a0a; }
    .scrollbar-thin::-webkit-scrollbar-thumb:hover { background: #444; }
    .scrollbar-thin::-webkit-scrollbar-corner { background: transparent; }
    
    .chart-container { position: relative; height: 14rem; width: 100%; }
    .chart-container-lg { position: relative; height: 18rem; width: 100%; }
    .chart-container-xl { position: relative; height: 22rem; width: 100%; }
    
    .avatar { width: 2.25rem; height: 2.25rem; border-radius: 0.5rem; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 0.75rem; }
    .avatar-sm { width: 1.75rem; height: 1.75rem; font-size: 0.6875rem; }
    .avatar-lg { width: 3rem; height: 3rem; font-size: 1rem; }
    
    .kbd { font-family: 'JetBrains Mono', monospace; font-size: 0.6875rem; padding: 0.125rem 0.375rem; background: var(--bg-elevated); border: 1px solid var(--border-default); border-radius: var(--radius-sm); color: var(--text-muted); }
    
    .tooltip { position: relative; }
    .tooltip::before { content: attr(data-tooltip); position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); margin-bottom: 0.375rem; padding: 0.375rem 0.625rem; background: #111; border: 1px solid #2a2a2a; border-radius: 0.375rem; font-size: 0.6875rem; color: #d4d4d4; white-space: nowrap; opacity: 0; visibility: hidden; transition: all 0.15s; z-index: 30; }
    .tooltip::after { content: ''; position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); margin-bottom: 0; border: 5px solid transparent; border-top-color: #2a2a2a; opacity: 0; visibility: hidden; transition: all 0.15s; }
    .tooltip:hover::before, .tooltip:hover::after { opacity: 1; visibility: visible; }
    
    .dropdown-menu { position: absolute; top: 100%; right: 0; margin-top: 0.375rem; min-width: 12rem; background: #0f0f0f; border: 1px solid #2a2a2a; border-radius: 0.75rem; box-shadow: 0 16px 48px -12px rgba(0,0,0,0.6); padding: 0.375rem; z-index: 40; animation: scaleIn 0.15s ease-out; }
    .dropdown-item { display: flex; align-items: center; gap: 0.625rem; width: 100%; padding: 0.5rem 0.75rem; border-radius: 0.5rem; color: #d4d4d4; font-size: 0.8125rem; font-weight: 500; transition: all 0.12s; background: none; border: none; text-align: left; cursor: pointer; }
    .dropdown-item:hover { background: #181818; color: #fff; }
    .dropdown-item.danger:hover { background: rgba(244,63,94,0.1); color: #f43f5e; }
    .dropdown-divider { height: 1px; background: #222; margin: 0.375rem 0; }
    
    .progress-ring { transform: rotate(-90deg); }
    .progress-ring-bg { fill: none; stroke: #222; stroke-width: 3; }
    .progress-ring-fill { fill: none; stroke-width: 3; stroke-linecap: round; transition: stroke-dashoffset 0.5s ease; }
    
    .divider-vertical { width: 1px; background: linear-gradient(to bottom, transparent, #2a2a2a, transparent); }
    .divider-horizontal { height: 1px; background: linear-gradient(to right, transparent, #2a2a2a, transparent); }
    
    .text-gradient { background: linear-gradient(135deg, #d6781e 0%, #f59e0b 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .text-gradient-emerald { background: linear-gradient(135deg, #10b981 0%, #06b6d4 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .text-gradient-violet { background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
  </style>
</head>
<body class="bg-surface-950 text-gray-100 min-h-screen bg-mesh bg-radial bg-grid antialiased">
  <a href="#viewContent" class="skip-link">Skip to main content</a>
  
  <script>
    window.__CHAOS_CONFIG__ = {
      apiBase: '/api',
      sseEndpoint: '/api/realtime/events'
    };
  </script>

  <div class="flex min-h-screen" id="app">
    <!-- Sidebar -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-surface-900/95 backdrop-blur-xl border-r border-gray-800/50 flex flex-col transform transition-transform duration-300 ease-out lg:translate-x-0 -translate-x-full" aria-label="Main navigation">
      <div class="flex flex-col h-full">
        <!-- Brand -->
        <div class="p-4 border-b border-gray-800/50 flex items-center gap-3">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-chaos-500 to-chaos-600 flex items-center justify-center relative overflow-hidden shadow-lg shadow-chaos-500/25">
            <svg class="w-5 h-5 text-surface-950" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.25">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/>
            </svg>
            <div class="absolute inset-0 bg-gradient-to-tr from-transparent via-white/15 to-transparent"></div>
          </div>
          <div>
            <h1 class="font-display font-bold text-white text-base">Chaos C2</h1>
            <p class="text-[0.625rem] text-gray-500 font-mono tracking-wide">v2.4.1</p>
          </div>
        </div>

        <!-- Campaign Selector -->
        <div class="p-4 border-b border-gray-800/50">
          <label class="block text-[0.5625rem] text-gray-500 uppercase tracking-widest mb-2">Active Campaign</label>
          <div class="relative">
            <select id="campaignSelect" class="input appearance-none pr-8" onchange="switchCampaign(this.value)">
              <option value="">Select campaign…</option>
            </select>
            <div class="absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none text-gray-500">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
            </div>
          </div>
          <button class="btn btn-secondary w-full mt-2 flex items-center justify-center gap-1.5" onclick="openCampaignModal()">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.5v15m7.5-7.5h-15"/></svg>
            <span>New Campaign</span>
          </button>
        </div>

        <!-- Navigation -->
        <nav class="flex-1 p-3 space-y-1 overflow-y-auto" role="navigation" aria-label="Main navigation">
          <a href="#" class="sidebar-link" data-view="overview" onclick="showView('overview'); return false;" aria-current="page">
            <svg class="w-4.5 h-4.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            <span>Overview</span>
            <span id="overviewBadge" class="ml-auto badge badge-active hidden"><span class="badge-dot"></span>Live</span>
          </a>
          <a href="#" class="sidebar-link" data-view="systems" onclick="showView('systems'); return false;">
            <svg class="w-4.5 h-4.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><path d="M3 17h18"/></svg>
            <span>Systems</span>
            <span id="systemsBadge" class="ml-auto badge badge-info hidden">0</span>
          </a>
          <a href="#" class="sidebar-link" data-view="campaigns" onclick="showView('campaigns'); return false;">
            <svg class="w-4.5 h-4.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
            <span>Campaigns</span>
            <span id="campaignsBadge" class="ml-auto badge hidden">0</span>
          </a>
          <a href="#" class="sidebar-link" data-view="analytics" onclick="showView('analytics'); return false;">
            <svg class="w-4.5 h-4.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
            <span>Analytics</span>
          </a>
          <a href="#" class="sidebar-link" data-view="geo" onclick="showView('geo'); return false;">
            <svg class="w-4.5 h-4.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><circle cx="12" cy="10" r="3"/><path d="M12 21.7a10 10 0 1 0 0-20 10 10 0 0 0 0 20z"/></svg>
            <span>Geographic</span>
          </a>
          <a href="#" class="sidebar-link" data-view="timeline" onclick="showView('timeline'); return false;">
            <svg class="w-4.5 h-4.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span>Timeline</span>
          </a>
          <a href="#" class="sidebar-link" data-view="files" onclick="showView('files'); return false;">
            <svg class="w-4.5 h-4.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            <span>Files</span>
          </a>
        </nav>

        <!-- Connection Status -->
        <div class="p-3 border-t border-gray-800/50">
          <div class="flex items-center gap-3">
            <div id="connIndicator" class="w-2 h-2 rounded-full bg-gray-600 transition-colors"></div>
            <div class="flex-1 min-w-0">
              <p class="text-[0.625rem] font-medium text-gray-300 truncate">Connection</p>
              <p id="connStatus" class="text-[0.625rem] text-gray-500 truncate">Disconnected</p>
            </div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Sidebar Overlay (Mobile) -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-black/60 z-30 hidden lg:hidden" onclick="toggleSidebar()" aria-hidden="true"></div>

    <!-- Main Content -->
    <main class="flex-1 lg:ml-64 min-h-screen flex flex-col" id="mainContent">
      <!-- Top Bar -->
      <header class="bg-surface-900/80 backdrop-blur-xl border-b border-gray-800/50 sticky top-0 z-20">
        <div class="flex items-center justify-between h-14 px-4 sm:px-5">
          <div class="flex items-center gap-3">
            <button class="lg:hidden btn-icon" onclick="toggleSidebar()" aria-label="Toggle navigation">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <h2 id="viewTitle" class="font-display font-semibold text-white text-lg hidden sm:block">Overview</h2>
          </div>

          <div class="flex items-center gap-2.5">
            <!-- Theme Selector -->
            <div class="relative hidden sm:block">
              <select id="themeSelect" class="input appearance-none pr-8 w-auto py-1.5 text-sm" onchange="EnhancedUI.themes.applyTheme(this.value)">
                <option value="chaos">Chaos</option>
                <option value="matrix">Matrix</option>
                <option value="midnight">Midnight</option>
                <option value="blood">Blood</option>
                <option value="mono">Mono</option>
              </select>
              <div class="absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none text-gray-500">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
              </div>
            </div>

            <!-- Time Range -->
            <select id="timeRange" class="input w-auto py-1.5 text-sm hidden md:block" onchange="refreshView()">
              <option value="1h">1h</option>
              <option value="6h">6h</option>
              <option value="24h" selected>24h</option>
              <option value="7d">7d</option>
              <option value="30d">30d</option>
            </select>

            <!-- Refresh Button -->
            <button id="refreshBtn" class="btn btn-secondary hidden sm:flex" onclick="refreshView()" aria-label="Refresh data">
              <svg class="w-4 h-4" id="refreshIcon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
              <span class="hidden sm:inline">Refresh</span>
            </button>

            <!-- Auth/User -->
            <div class="flex items-center gap-2">
              <button id="authBtn" class="btn btn-ghost text-xs hidden sm:flex" onclick="openAuthModal()">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
                <span id="authStatus">Sign In</span>
              </button>
              
              <!-- User Menu (when logged in) -->
              <div id="userMenu" class="hidden relative">
                <button class="btn-icon relative" onclick="toggleUserMenu()" aria-label="User menu" aria-expanded="false">
                  <div id="userAvatar" class="avatar bg-gradient-to-br from-chaos-500 to-chaos-600 text-surface-950">U</div>
                </button>
                <div id="userDropdown" class="dropdown-menu hidden">
                  <div class="px-3 py-2 border-b border-gray-800">
                    <p class="text-xs font-medium text-white" id="userName">User</p>
                    <p class="text-[0.5625rem] text-gray-500 font-mono" id="userRole">Role</p>
                  </div>
                  <button class="dropdown-item" onclick="openCampaignModal()">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.5v15m7.5-7.5h-15"/></svg>
                    New Campaign
                  </button>
                  <button class="dropdown-item" onclick="showView('campaigns')">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                    Campaigns
                  </button>
                  <button class="dropdown-item" onclick="showView('systems')">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c-.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    Systems
                  </button>
                  <div class="dropdown-divider"></div>
                  <button class="dropdown-item danger" onclick="signOut()">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                    Sign Out
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </header>

      <!-- View Tabs (Mobile) -->
      <div class="lg:hidden overflow-x-auto px-3 py-2 border-b border-gray-800/50 scrollbar-thin" id="mobileTabs" role="tablist">
        <button class="tab-btn tab-btn-active whitespace-nowrap" data-view="overview" onclick="showView('overview')" role="tab" aria-selected="true">Overview</button>
        <button class="tab-btn whitespace-nowrap" data-view="systems" onclick="showView('systems')" role="tab" aria-selected="false">Systems</button>
        <button class="tab-btn whitespace-nowrap" data-view="campaigns" onclick="showView('campaigns')" role="tab" aria-selected="false">Campaigns</button>
        <button class="tab-btn whitespace-nowrap" data-view="analytics" onclick="showView('analytics')" role="tab" aria-selected="false">Analytics</button>
        <button class="tab-btn whitespace-nowrap" data-view="geo" onclick="showView('geo')" role="tab" aria-selected="false">Geo</button>
        <button class="tab-btn whitespace-nowrap" data-view="timeline" onclick="showView('timeline')" role="tab" aria-selected="false">Timeline</button>
        <button class="tab-btn whitespace-nowrap" data-view="files" onclick="showView('files')" role="tab" aria-selected="false">Files</button>
      </div>

      <!-- View Content -->
      <div class="flex-1 overflow-auto p-4 sm:p-5" id="viewContent">
        <!-- Views rendered dynamically -->
      </div>
    </main>
  </div>

  <!-- Modals -->
  <div id="modalRoot"></div>

  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container pointer-events-none"></div>

  <!-- Chart.js Default Config -->
  <script>
    Chart.defaults.color = '#71717a';
    Chart.defaults.font.family = 'Inter';
    Chart.defaults.borderColor = '#262626';
    Chart.defaults.plugins.legend.labels.usePointStyle = true;
    Chart.defaults.plugins.legend.labels.padding = 16;
    Chart.defaults.plugins.legend.labels.font.size = 11;
    Chart.defaults.plugins.tooltip.backgroundColor = '#111';
    Chart.defaults.plugins.tooltip.borderColor = '#2a2a2a';
    Chart.defaults.plugins.tooltip.borderWidth = 1;
    Chart.defaults.plugins.tooltip.padding = 10;
    Chart.defaults.plugins.tooltip.titleFont.size = 12;
    Chart.defaults.plugins.tooltip.bodyFont.size = 11;
    Chart.defaults.plugins.tooltip.bodyFont.family = 'JetBrains Mono';
    Chart.defaults.plugins.tooltip.cornerRadius = 8;
    Chart.defaults.scales.x.grid.color = '#222';
    Chart.defaults.scales.y.grid.color = '#222';
    Chart.defaults.interaction.mode = 'index';
    Chart.defaults.interaction.intersect = false;
  </script>

  <!-- Main App Script -->
  <script src="/app.js"></script>
  <script src="/js/command-palette.js"></script>
</body>
</html>
