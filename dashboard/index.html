<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chaos C2 — Command & Control</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/design-system.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-treemap@3.0.0/dist/chartjs-chart-treemap.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-funnel@3.0.0/dist/chartjs-chart-funnel.umd.min.js"></script>
  <script src="/enhanced-ui.js"></script>
  <script src="/js/command-palette.js"></script>
  <style>
    * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    .font-display { font-family: 'Space Grotesk', 'Inter', sans-serif; }
    
    .bg-grid { background-image: linear-gradient(rgba(59,130,246,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(59,130,246,0.02) 1px, transparent 1px); background-size: 48px 48px; }
    .bg-radial { background: radial-gradient(ellipse at 50% 0%, rgba(59,130,246,0.04) 0%, transparent 60%), var(--bg-base); }
    
    .scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-default); border-radius: 4px; border: 2px solid var(--bg-base); }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-bright); }
    ::-webkit-scrollbar-corner { background: var(--bg-base); }
    
    .chart-container { position: relative; height: 14rem; width: 100%; }
    .chart-container-lg { position: relative; height: 18rem; width: 100%; }
    .chart-container-xl { position: relative; height: 22rem; width: 100%; }
    
    .avatar { width: 2.5rem; height: 2.5rem; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: var(--text-sm); background: linear-gradient(135deg, var(--accent-primary), #2563eb); color: white; }
    .avatar-sm { width: 1.75rem; height: 1.75rem; font-size: var(--text-xs); }
    .avatar-lg { width: 3rem; height: 3rem; font-size: var(--text-base); }
    
    .kbd { font-family: var(--font-mono); font-size: var(--text-xs); padding: 2px 6px; background: var(--bg-input); border: 1px solid var(--border-default); border-radius: var(--radius-sm); color: var(--fg-muted); box-shadow: 0 2px 0 var(--border-subtle); }
    
    .tooltip { position: relative; }
    .tooltip::before { content: attr(data-tooltip); position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); margin-bottom: 6px; padding: 6px 10px; background: var(--bg-elevated); border: 1px solid var(--border-default); border-radius: var(--radius-sm); font-size: var(--text-xs); color: var(--fg-secondary); white-space: nowrap; opacity: 0; visibility: hidden; transition: all var(--duration-fast); z-index: 30; }
    .tooltip::after { content: ''; position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); margin-bottom: 0; border: 5px solid transparent; border-top-color: var(--border-default); opacity: 0; visibility: hidden; transition: all var(--duration-fast); }
    .tooltip:hover::before, .tooltip:hover::after { opacity: 1; visibility: visible; }
    
    .dropdown-menu { position: absolute; top: 100%; right: 0; margin-top: var(--space-2); min-width: 12rem; background: var(--bg-elevated); border: 1px solid var(--border-default); border-radius: var(--radius-md); box-shadow: var(--shadow-lg); padding: var(--space-2); z-index: 40; animation: modalIn var(--duration-fast) var(--ease-smooth); }
    .dropdown-item { display: flex; align-items: center; gap: var(--space-2); width: 100%; padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); color: var(--fg-secondary); font-size: var(--text-sm); font-weight: 500; transition: all var(--duration-fast); background: none; border: none; text-align: left; cursor: pointer; }
    .dropdown-item:hover { background: var(--bg-hover); color: var(--fg-primary); }
    .dropdown-item.danger:hover { color: var(--accent-danger); }
    .dropdown-divider { height: 1px; background: var(--border-subtle); margin: var(--space-2) 0; }
    
    .progress-ring { transform: rotate(-90deg); }
    .progress-ring-bg { fill: none; stroke: var(--border-default); stroke-width: 3; }
    .progress-ring-fill { fill: none; stroke: var(--accent-primary); stroke-width: 3; stroke-linecap: round; transition: stroke-dashoffset 0.5s var(--ease-smooth); filter: drop-shadow(0 0 4px var(--accent-primary)); }
    
    .divider-vertical { width: 1px; background: linear-gradient(to bottom, transparent, var(--border-default), transparent); }
    .divider-horizontal { height: 1px; background: linear-gradient(to right, transparent, var(--border-default), transparent); }
    
    .text-gradient { background: linear-gradient(135deg, var(--accent-primary), var(--accent-info)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .text-gradient-success { background: linear-gradient(135deg, var(--accent-success), var(--accent-info)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .text-gradient-warning { background: linear-gradient(135deg, var(--accent-warning), var(--accent-rose)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
  </style>
</head>
<body class="bg-base text-gray-100 min-h-screen antialiased bg-radial bg-grid">
  <a href="#viewContent" class="skip-link">Skip to main content</a>
  
  <script>
    window.__CHAOS_CONFIG__ = {
      apiBase: '/api',
      sseEndpoint: '/api/realtime/events'
    };
  </script>

  <div class="flex min-h-screen" id="app">
    <!-- Sidebar -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-surface/95 backdrop-blur-xl border-r border-border-default flex flex-col transform transition-transform duration-300 ease-out lg:translate-x-0 -translate-x-full" aria-label="Main navigation">
      <div class="flex flex-col h-full">
        <!-- Brand -->
        <div class="p-4 border-b border-border-default flex items-center gap-3">
          <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-accent-primary to-accent-primary/80 flex items-center justify-center">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.19 8.688a4.5 4.5 0 011.242 7.244l-4.5 4.5a4.5 4.5 0 01-6.364-6.364l1.757-1.757a1.5 1.5 0 011.061 0zM21.752 15.892a4.5 4.5 0 01-1.242 7.244l-4.5 4.5a4.5 4.5 0 01-6.364-6.364l1.757-1.757a1.5 1.5 0 011.061 0zM18.53 4.668a4.5 4.5 0 011.242 7.244l-4.5 4.5a4.5 4.5 0 01-6.364-6.364l1.757-1.757a1.5 1.5 0 011.061 0z"/>
            </svg>
          </div>
          <div>
            <h1 class="font-display font-semibold text-white text-lg tracking-tight">Chaos C2</h1>
            <p class="text-xs text-fg-muted font-mono tracking-wide">v2.4.1</p>
          </div>
        </div>

        <!-- Campaign Selector -->
        <div class="p-4 border-b border-border-default">
          <label class="block text-xs text-fg-muted uppercase tracking-widest mb-2">Active Campaign</label>
          <div class="relative">
            <select id="campaignSelect" class="input appearance-none pr-8" onchange="switchCampaign(this.value)">
              <option value="">Select campaign…</option>
            </select>
            <div class="absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none text-fg-muted">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
            </div>
          </div>
          <button class="btn btn-secondary w-full mt-2 flex items-center justify-center gap-1.5" onclick="openCampaignModal()">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            <span>New Campaign</span>
          </button>
        </div>

        <!-- Navigation -->
        <nav class="flex-1 p-3 space-y-1 overflow-y-auto" role="navigation" aria-label="Main navigation">
          <a href="#" class="sidebar-link" data-view="overview" onclick="showView('overview'); return false;" aria-current="page">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            <span>Overview</span>
            <span id="overviewBadge" class="ml-auto badge badge-active hidden"><span class="badge-dot"></span>Live</span>
          </a>
          <a href="#" class="sidebar-link" data-view="systems" onclick="showView('systems'); return false;">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="14" width="7" height="9" rx="1"/><path d="M3 17h18"/></svg>
            <span>Systems</span>
            <span id="systemsBadge" class="ml-auto badge badge-info hidden">0</span>
          </a>
          <a href="#" class="sidebar-link" data-view="campaigns" onclick="showView('campaigns'); return false;">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
            <span>Campaigns</span>
            <span id="campaignsBadge" class="ml-auto badge hidden">0</span>
          </a>
          <a href="#" class="sidebar-link" data-view="analytics" onclick="showView('analytics'); return false;">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
            <span>Analytics</span>
          </a>
          <a href="#" class="sidebar-link" data-view="geo" onclick="showView('geo'); return false;">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><circle cx="12" cy="10" r="3"/><path d="M12 21.7a10 10 0 1 0 0-20 10 10 0 0 0 0 20z"/></svg>
            <span>Geographic</span>
          </a>
          <a href="#" class="sidebar-link" data-view="timeline" onclick="showView('timeline'); return false;">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span>Timeline</span>
          </a>
          <a href="#" class="sidebar-link" data-view="files" onclick="showView('files'); return false;">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            <span>Files</span>
          </a>
        </nav>

        <!-- Connection Status -->
        <div class="p-3 border-t border-border-default">
          <div class="flex items-center gap-3">
            <div id="connIndicator" class="w-2 h-2 rounded-full bg-fg-muted transition-colors"></div>
            <div class="flex-1 min-w-0">
              <p class="text-xs font-medium text-fg-secondary truncate">Connection</p>
              <p id="connStatus" class="text-xs text-fg-muted truncate">Disconnected</p>
            </div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Sidebar Overlay (Mobile) -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-black/60 z-30 hidden lg:hidden" onclick="toggleSidebar()" aria-hidden="true"></div>

    <!-- Main Content -->
    <main class="flex-1 lg:ml-64 min-h-screen flex flex-col" id="mainContent">
      <!-- Top Bar -->
      <header class="bg-surface/80 backdrop-blur-xl border-b border-border-default sticky top-0 z-20">
        <div class="flex items-center justify-between h-14 px-4 sm:px-5">
          <div class="flex items-center gap-3">
            <button class="lg:hidden btn-icon" onclick="toggleSidebar()" aria-label="Toggle navigation">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <h2 id="viewTitle" class="font-display font-semibold text-white text-lg hidden sm:block">Overview</h2>
          </div>

          <div class="flex items-center gap-2.5">
            <!-- Theme Selector -->
            <div class="relative hidden sm:block">
              <select id="themeSelect" class="input appearance-none pr-8 w-auto py-1.5 text-sm" onchange="EnhancedUI.themes.applyTheme(this.value)">
                <option value="default">Default</option>
                <option value="ocean">Ocean</option>
                <option value="forest">Forest</option>
                <option value="sunset">Sunset</option>
                <option value="midnight">Midnight</option>
              </select>
              <div class="absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none text-fg-muted">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
              </div>
            </div>

            <!-- Time Range -->
            <select id="timeRange" class="input w-auto py-1.5 text-sm hidden md:block" onchange="refreshView()">
              <option value="1h">1H</option>
              <option value="6h">6H</option>
              <option value="24h" selected>24H</option>
              <option value="7d">7D</option>
              <option value="30d">30D</option>
            </select>

            <!-- Refresh Button -->
            <button id="refreshBtn" class="btn btn-secondary hidden sm:flex" onclick="refreshView()" aria-label="Refresh data">
              <svg class="w-4 h-4" id="refreshIcon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
              <span class="hidden sm:inline">Refresh</span>
            </button>

            <!-- Auth/User -->
            <div class="flex items-center gap-2">
              <button id="authBtn" class="btn btn-ghost text-xs hidden sm:flex" onclick="openAuthModal()">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg>
                <span id="authStatus">Sign In</span>
              </button>
              
              <!-- User Menu (when logged in) -->
              <div id="userMenu" class="hidden relative">
                <button class="btn-icon relative" onclick="toggleUserMenu()" aria-label="User menu" aria-expanded="false">
                  <div id="userAvatar" class="avatar bg-gradient-to-br from-accent-primary to-accent-primary/70">U</div>
                </button>
                <div id="userDropdown" class="dropdown-menu hidden">
                  <div class="px-3 py-2 border-b border-border-default">
                    <p class="text-xs font-medium text-fg-primary" id="userName">User</p>
                    <p class="text-xs text-fg-muted font-mono" id="userRole">Role</p>
                  </div>
                  <button class="dropdown-item" onclick="openCampaignModal()">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v15m7.5-7.5h-15"/></svg>
                    New Campaign
                  </button>
                  <button class="dropdown-item" onclick="showView('campaigns')">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                    Campaigns
                  </button>
                  <button class="dropdown-item" onclick="showView('systems')">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c-.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    Systems
                  </button>
                  <div class="dropdown-divider"></div>
                  <button class="dropdown-item danger" onclick="signOut()">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                    Sign Out
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </header>

      <!-- View Tabs (Mobile) -->
      <div class="lg:hidden overflow-x-auto px-3 py-2 border-b border-border-default scrollbar-thin" id="mobileTabs" role="tablist">
        <button class="tab-btn tab-btn-active whitespace-nowrap" data-view="overview" onclick="showView('overview')" role="tab" aria-selected="true">Overview</button>
        <button class="tab-btn whitespace-nowrap" data-view="systems" onclick="showView('systems')" role="tab" aria-selected="false">Systems</button>
        <button class="tab-btn whitespace-nowrap" data-view="campaigns" onclick="showView('campaigns')" role="tab" aria-selected="false">Campaigns</button>
        <button class="tab-btn whitespace-nowrap" data-view="analytics" onclick="showView('analytics')" role="tab" aria-selected="false">Analytics</button>
        <button class="tab-btn whitespace-nowrap" data-view="geo" onclick="showView('geo')" role="tab" aria-selected="false">Geographic</button>
        <button class="tab-btn whitespace-nowrap" data-view="timeline" onclick="showView('timeline')" role="tab" aria-selected="false">Timeline</button>
        <button class="tab-btn whitespace-nowrap" data-view="files" onclick="showView('files')" role="tab" aria-selected="false">Files</button>
      </div>

      <!-- View Content -->
      <div class="flex-1 overflow-auto p-4 sm:p-5" id="viewContent">
        <!-- Views rendered dynamically -->
      </div>
    </main>
  </div>

  <!-- Modals -->
  <div id="modalRoot"></div>

  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container pointer-events-none"></div>

  <!-- Chart.js Default Config -->
  <script>
    Chart.defaults.color = '#6b7f9e';
    Chart.defaults.font.family = 'Inter';
    Chart.defaults.borderColor = '#2a3a4f';
    Chart.defaults.plugins.legend.labels.usePointStyle = true;
    Chart.defaults.plugins.legend.labels.padding = 16;
    Chart.defaults.plugins.legend.labels.font.size = 11;
    Chart.defaults.plugins.tooltip.backgroundColor = '#0f1722';
    Chart.defaults.plugins.tooltip.borderColor = '#2a3a4f';
    Chart.defaults.plugins.tooltip.borderWidth = 1;
    Chart.defaults.plugins.tooltip.padding = 10;
    Chart.defaults.plugins.tooltip.titleFont.size = 12;
    Chart.defaults.plugins.tooltip.bodyFont.size = 11;
    Chart.defaults.plugins.tooltip.bodyFont.family = 'JetBrains Mono';
    Chart.defaults.plugins.tooltip.cornerRadius = 8;
    Chart.defaults.scales.x.grid.color = '#1e2a3a';
    Chart.defaults.scales.y.grid.color = '#1e2a3a';
    Chart.defaults.interaction.mode = 'index';
    Chart.defaults.interaction.intersect = false;
  </script>

  <!-- Main App Script -->
  <script src="/enhanced-ui.js"></script>
  <script src="/js/command-palette.js"></script>
  <script src="/app.js"></script>
</body>
</html>
