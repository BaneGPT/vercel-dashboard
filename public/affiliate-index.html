  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            chaos: {
              50: '#fdf8f0', 100: '#faebe0', 200: '#f4d3b5', 300: '#eab778',
              400: '#e09542', 500: '#d6781e', 600: '#c45f15', 700: '#a04512',
              800: '#813713', 900: '#683013', 950: '#381507'
            },
            acc: {
              emerald: '#10b981', emeraldDim: 'rgba(16,185,129,0.15)',
              amber: '#f59e0b', amberDim: 'rgba(245,158,11,0.15)',
              rose: '#f43f5e', roseDim: 'rgba(244,63,94,0.15)',
              sky: '#0ea5e9', skyDim: 'rgba(14,165,233,0.15)',
              violet: '#8b5cf6', violetDim: 'rgba(139,92,246,0.15)',
              cyan: '#06b6d4', cyanDim: 'rgba(6,182,212,0.15)'
            },
            surface: {
              950: '#050505', 900: '#0d0d0d', 850: '#141414', 
              800: '#1c1c1c', 750: '#242424', 700: '#2d2d2d'
            }
          },
          fontFamily: {
            mono: ['JetBrains Mono', 'Fira Code', 'Consolas', 'monospace'],
            sans: ['Inter', 'system-ui', 'sans-serif']
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'spin-slow': 'spin 2s linear infinite',
            'fade-in': 'fadeIn 0.3s ease-out',
            'slide-up': 'slideUp 0.4s ease-out',
            'slide-in-right': 'slideInRight 0.3s ease-out'
          },
          keyframes: {
            fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
            slideUp: { '0%': { opacity: '0', transform: 'translateY(10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
            slideInRight: { '0%': { opacity: '0', transform: 'translateX(10px)' }, '100%': { opacity: '1', transform: 'translateX(0)' } }
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>

    .btn-primary:hover { background: #d6781e; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { background: #1c1c1c; color: #e5e5e5; font-weight: 500; border-radius: 0.5rem; padding: 0.5rem 1rem; border: 1px solid #374151; transition: all 0.2s; }
    .btn-secondary:hover { background: #242424; }
    .btn-secondary:active { transform: scale(0.98); }
    .btn-ghost { color: #9ca3af; font-weight: 500; border-radius: 0.5rem; padding: 0.5rem 1rem; transition: all 0.2s; }
    .btn-ghost:hover { color: white; background: #1c1c1c; }
    .btn-danger { background: #7f1d1d; color: #fecaca; font-weight: 500; border-radius: 0.5rem; padding: 0.5rem 1rem; border: 1px solid #991b1b; transition: all 0.2s; }
    .btn-danger:hover { background: #991b1b; }
    .input-base { width: 100%; background: #1c1c1c; border: 1px solid #374151; border-radius: 0.5rem; padding: 0.5rem 0.75rem; color: white; transition: all 0.2s; }

    .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; font-weight: 700; color: white; }
    .stat-label { font-size: 0.625rem; color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.25rem; }
    .badge { display: inline-flex; align-items: center; gap: 0.375rem; padding: 0.125rem 0.625rem; border-radius: 9999px; font-size: 0.625rem; font-weight: 500; }
    .badge-active { background: rgba(16,185,129,0.15); color: #10b981; }
    .badge-inactive { background: #1f2937; color: #9ca3af; }
    .badge-warning { background: rgba(245,158,11,0.15); color: #f59e0b; }
    .badge-danger { background: rgba(244,63,94,0.15); color: #f43f5e; }
    .badge-info { background: rgba(14,165,233,0.15); color: #0ea5e9; }
    .badge-bronze { background: rgba(205,127,50,0.15); color: #cd7f32; }
    .badge-silver { background: rgba(192,192,192,0.15); color: #c0c0c0; }
    .badge-gold { background: rgba(255,215,0,0.15); color: #ffd700; }
    .badge-platinum { background: rgba(229,228,226,0.15); color: #e5e4e2; }
    .tab-btn { padding: 0.5rem 1rem; font-size: 0.875rem; font-weight: 500; color: #9ca3af; border-radius: 0.5rem; transition: all 0.2s; }
    .tab-btn:hover { color: white; background: #1c1c1c; }
    .tab-btn-active { color: #d6781e; background: rgba(56,21,7,0.5); border-bottom: 2px solid #d6781e; }
    .table-header { padding: 0.75rem 1rem; font-size: 0.625rem; font-weight: 600; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.05em; background: rgba(20,20,20,0.5); position: sticky; top: 0; }
    .table-cell { padding: 0.75rem 1rem; font-size: 0.875rem; color: #d1d5db; border-top: 1px solid #2d2d2d; }
    .table-row { transition: background 0.2s; cursor: pointer; }
    .table-row:hover { background: rgba(28,28,28,0.5); }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 50; display: none; align-items: center; justify-content: center; padding: 1rem; }
    .modal-overlay.open { display: flex; }
    .modal-panel { background: #0d0d0d; border: 1px solid #374151; border-radius: 1rem; max-width: 48rem; width: 100%; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; animation: slideUp 0.4s ease-out; }
    .chart-container { position: relative; height: 16rem; width: 100%; }
    .chart-container-lg { position: relative; height: 20rem; width: 100%; }
    .kbd { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; padding: 0.125rem 0.375rem; background: #1c1c1c; border: 1px solid #374151; border-radius: 0.25rem; }
    .sidebar-link { display: flex; align-items: center; gap: 0.75rem; padding: 0.625rem 0.75rem; border-radius: 0.5rem; color: #9ca3af; transition: all 0.2s; }
    .sidebar-link:hover { color: white; background: #1c1c1c; }
    .sidebar-link-active { color: #d6781e; background: rgba(56,21,7,0.5); border-left: 2px solid #d6781e; }
    .drop-zone { border: 2px dashed #374151; border-radius: 0.75rem; padding: 2rem; text-align: center; transition: all 0.2s; }
    .drop-zone:hover { border-color: #d6781e; background: rgba(56,21,7,0.1); }
    ::selection { background: rgba(214,120,30,0.3); color: white; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; } }
    .animate-slide-in-right { animation: slideInRight 0.3s ease-out; }
    .animate-slide-up { animation: slideUp 0.4s ease-out; }
    .animate-fade-in { animation: fadeIn 0.3s ease-out; }
    
    /* Tier progress bar */
    .tier-progress { height: 6px; border-radius: 3px; background: #2d2d2d; overflow: hidden; }
    .tier-progress-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease-out; }
    
    /* Copy button */
    .copy-btn { position: relative; }
    .copy-btn.copied::after { content: 'Copied!'; position: absolute; top: -1.5rem; left: 50%; transform: translateX(-50%); background: #10b981; color: white; padding: 0.25rem 0.5rem; border-radius: 0.25rem; font-size: 0.75rem; white-space: nowrap; animation: fadeIn 0.2s; }
  </style>
</head>
<body class="bg-surface-950 text-gray-100 min-h-screen bg-radial bg-grid">
